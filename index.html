<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mony - Voice Player for Krishiv</title>
    <style>
        :root {
          --bg-color: #0f172a;
          --card-bg: #1e293b;
          --accent: #6366f1;
          --accent-hover: #4f46e5;
          --text-main: #f8fafc;
          --text-muted: #94a3b8;
          --active-green: #22c55e;
        }

        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
          font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
          background-color: var(--bg-color);
          color: var(--text-main);
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          align-items: center;
          padding: 12px;
        }

        header {
          text-align: center;
          margin-bottom: 15px;
          width: 100%;
        }

        header h1 {
          font-size: clamp(1.5rem, 5vw, 2.2rem);
          color: var(--accent);
          margin-bottom: 4px;
        }

        header p {
          color: var(--text-muted);
          font-size: clamp(0.8rem, 3vw, 0.95rem);
          padding: 0 10px;
        }

        /* Fully Responsive Grid Layout */
        .container {
          width: 100%;
          max-width: 1000px;
          display: grid;
          grid-template-columns: 1fr;
          gap: 15px;
        }

        @media (min-width: 768px) {
          .container {
            grid-template-columns: 340px 1fr;
            gap: 20px;
          }
        }

        .card {
          background-color: var(--card-bg);
          border-radius: 12px;
          padding: 16px;
          box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
          width: 100%;
        }

        /* Voice Status Box */
        .voice-status-box {
          display: flex;
          flex-direction: column;
          align-items: center;
          text-align: center;
          gap: 12px;
        }

        .mic-btn {
          width: clamp(60px, 18vw, 75px);
          height: clamp(60px, 18vw, 75px);
          border-radius: 50%;
          border: none;
          background-color: #334155;
          color: white;
          font-size: clamp(1.5rem, 5vw, 2rem);
          cursor: pointer;
          transition: all 0.3s ease;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        .mic-btn.listening {
          background-color: var(--active-green);
          box-shadow: 0 0 20px var(--active-green);
        }

        .transcription-box {
          width: 100%;
          background-color: rgba(0,0,0,0.25);
          border-radius: 8px;
          padding: 10px;
          min-height: 50px;
          font-size: 0.85rem;
          color: #cbd5e1;
          word-break: break-word;
        }

        /* Highlighted Response Text Container */
        .command-feedback {
          width: 100%;
          padding: 10px;
          background-color: rgba(99, 102, 241, 0.15);
          border: 1px solid var(--accent);
          border-radius: 8px;
          font-weight: 600;
          color: #a5b4fc;
          font-size: 0.95rem;
          word-break: break-word;
          text-align: center;
          min-height: 42px;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        .lang-selector {
          display: flex;
          gap: 8px;
          width: 100%;
          justify-content: center;
        }

        .lang-btn {
          flex: 1;
          max-width: 120px;
          padding: 8px 12px;
          border: 1px solid var(--accent);
          background: transparent;
          color: var(--text-main);
          border-radius: 6px;
          cursor: pointer;
          font-size: 0.85rem;
        }

        .lang-btn.active {
          background: var(--accent);
        }

        /* Audio Player Controls */
        .player-section {
          display: flex;
          flex-direction: column;
          gap: 12px;
        }

        canvas {
          width: 100%;
          height: 100px;
          background-color: #090d16;
          border-radius: 8px;
        }

        .track-info {
          text-align: center;
        }

        .track-title {
          font-weight: bold;
          font-size: clamp(0.95rem, 3.5vw, 1.1rem);
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }

        .controls-row {
          display: flex;
          justify-content: center;
          align-items: center;
          gap: 15px;
        }

        .btn-ctrl {
          background-color: #334155;
          border: none;
          color: white;
          padding: 12px 20px;
          border-radius: 8px;
          cursor: pointer;
          font-size: 1.2rem;
          touch-action: manipulation;
        }

        .btn-ctrl:active {
          background-color: var(--accent);
        }

        .file-dropzone {
          border: 2px dashed #475569;
          border-radius: 8px;
          padding: 12px;
          text-align: center;
          cursor: pointer;
          font-size: 0.85rem;
          color: var(--text-muted);
        }

        .playlist {
          max-height: 220px;
          overflow-y: auto;
          list-style: none;
          margin-top: 5px;
          border: 1px solid #334155;
          border-radius: 6px;
        }

        .playlist li {
          padding: 10px 12px;
          border-bottom: 1px solid #334155;
          cursor: pointer;
          font-size: 0.85rem;
          word-break: break-word;
        }

        .playlist li:last-child {
          border-bottom: none;
        }

        .playlist li.active {
          background-color: #334155;
          color: #818cf8;
          font-weight: bold;
        }
    </style>
</head>
<body>

<header>
    <h1>Mony Voice Player</h1>
    <p>Prefix commands with <strong>"Mony"</strong> (e.g. <em>"Good morning Mony"</em> or <em>"Mony Kesariya gao"</em>)</p>
</header>

<div class="container">
    <!-- Voice Controls Panel -->
    <div class="card voice-status-box">
        <h3>Voice Assistant</h3>
        <button id="micBtn" class="mic-btn">🎤</button>
        <div id="statusText" style="font-size: 0.85rem; color: var(--text-muted);">Microphone: Off</div>

        <div class="lang-selector">
            <button id="langEn" class="lang-btn active" onclick="setLanguage('en-US')">English</button>
            <button id="langHi" class="lang-btn" onclick="setLanguage('hi-IN')">Hindi (हिंदी)</button>
        </div>

        <div class="transcription-box" id="transcription">Click Mic to start listening...</div>

        <!-- Response Display Box -->
        <div class="command-feedback" id="feedback">Waiting for voice command...</div>
    </div>

    <!-- Audio Player Panel -->
    <div class="card player-section">
        <canvas id="visualizer"></canvas>
        <div class="track-info">
            <div class="track-title" id="trackTitle">Loading playlist...</div>
        </div>

        <div class="controls-row">
            <button class="btn-ctrl" onclick="prevTrack()">⏮️</button>
            <button class="btn-ctrl" id="playPauseBtn" onclick="togglePlay()">▶️</button>
            <button class="btn-ctrl" onclick="nextTrack()">⏭️</button>
        </div>

        <div class="file-dropzone" onclick="document.getElementById('fileInput').click()">
            📁 Select local audio files
            <input type="file" id="fileInput" multiple accept="audio/*" style="display: none;" onchange="loadFiles(this.files)">
        </div>

        <h4>Playlist</h4>
        <ul class="playlist" id="playlist"></ul>
    </div>
</div>

<script>
    let audio = new Audio();
    audio.crossOrigin = "anonymous";
    let playlist = [];
    let currentIndex = -1;
    let recognition;
    let isListening = false;
    let currentLang = 'en-US';

    let audioCtx, analyser, srcNode;
    const canvas = document.getElementById('visualizer');
    const canvasCtx = canvas.getContext('2d');

    function speakResponse(text) {
      if ('speechSynthesis' in window) {
        if (recognition && isListening) {
          try { recognition.stop(); } catch(e) {}
        }

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = currentLang;
        utterance.rate = 0.95;

        utterance.onend = () => {
          if (isListening) {
            try { recognition.start(); } catch(e) {}
          }
        };

        window.speechSynthesis.speak(utterance);
      }
    }

    async function loadGitHubSongsFolder() {
      try {
        const response = await fetch('./songs/playlist.json');
        if (response.ok) {
          const songFiles = await response.json();
          songFiles.forEach(filename => {
            const fullFileName = filename.endsWith('.mp3') ? filename : `${filename}.mp3`;
            addTrackToPlaylist(filename, `./songs/${encodeURIComponent(fullFileName)}`);
          });
          document.getElementById('trackTitle').textContent = playlist.length > 0 ? playlist[0].name : "No tracks found";
        } else {
          document.getElementById('trackTitle').textContent = "Select local audio files to play.";
        }
      } catch (err) {
        document.getElementById('trackTitle').textContent = "Select local audio files to play.";
      }
    }

    function addTrackToPlaylist(name, url) {
      const cleanTitle = name.replace(/\.[^/.]+$/, "").replace(/_/g, " ");
      playlist.push({
        name: cleanTitle,
        tokens: cleanTitle.toLowerCase().split(/[^a-zA-Z0-9\u0900-\u097F]+/).filter(Boolean),
        url: url
      });
      updatePlaylistUI();
      if (currentIndex === -1 && playlist.length > 0) {
        playTrack(0, false);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadGitHubSongsFolder();
    });

    function initAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        srcNode = audioCtx.createMediaElementSource(audio);
        srcNode.connect(analyser);
        analyser.connect(audioCtx.destination);
        analyser.fftSize = 64;
        drawVisualizer();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function drawVisualizer() {
      requestAnimationFrame(drawVisualizer);
      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);
      analyser.getByteFrequencyData(dataArray);

      canvasCtx.fillStyle = '#090d16';
      canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

      const barWidth = (canvas.width / bufferLength) * 2.5;
      let x = 0;
      for (let i = 0; i < bufferLength; i++) {
        const barHeight = (dataArray[i] / 255) * canvas.height;
        canvasCtx.fillStyle = '#6366f1';
        canvasCtx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
        x += barWidth + 2;
      }
    }

    function loadFiles(files) {
      for (let file of files) {
        addTrackToPlaylist(file.name, URL.createObjectURL(file));
      }
    }

    function updatePlaylistUI() {
      const listEl = document.getElementById('playlist');
      listEl.innerHTML = '';
      playlist.forEach((track, idx) => {
        const li = document.createElement('li');
        li.textContent = `${idx + 1}. ${track.name}`;
        if (idx === currentIndex) li.classList.add('active');
        li.onclick = () => playTrack(idx, true);
        listEl.appendChild(li);
      });
    }

    function playTrack(index, shouldPlay = true) {
      if (index < 0 || index >= playlist.length) return;
      initAudioContext();
      currentIndex = index;
      audio.src = playlist[currentIndex].url;
      document.getElementById('trackTitle').textContent = playlist[currentIndex].name;

      if (shouldPlay) {
        audio.play().then(() => {
          document.getElementById('playPauseBtn').textContent = '⏸️';
        }).catch(err => console.log("Playback error:", err));
      }
      updatePlaylistUI();
    }

    function togglePlay() {
      if (!audio.src) return;
      initAudioContext();
      if (audio.paused) {
        audio.play();
        document.getElementById('playPauseBtn').textContent = '⏸️';
      } else {
        audio.pause();
        document.getElementById('playPauseBtn').textContent = '▶️';
      }
    }

    function nextTrack() {
      if (playlist.length === 0) return;
      playTrack((currentIndex + 1) % playlist.length, true);
    }

    function prevTrack() {
      if (playlist.length === 0) return;
      playTrack((currentIndex - 1 + playlist.length) % playlist.length, true);
    }

    function searchAndPlaySong(query) {
      if (playlist.length === 0) return false;
      const searchTokens = query.toLowerCase().split(/[^a-zA-Z0-9\u0900-\u097F]+/).filter(w => w.length > 1);
      if (searchTokens.length === 0) return false;

      let bestScore = -1;
      let bestIndex = -1;

      playlist.forEach((track, idx) => {
        let score = 0;
        searchTokens.forEach(st => {
          track.tokens.forEach(tt => {
            if (tt === st) score += 3;
            else if (tt.includes(st) || st.includes(tt)) score += 1;
          });
        });

        if (score > bestScore && score > 0) {
          bestScore = score;
          bestIndex = idx;
        }
      });

      if (bestIndex !== -1) {
        playTrack(bestIndex, true);
        return true;
      }
      return false;
    }

    // Speech Recognition Loop
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      alert("Browser does not support Speech Recognition. Use Chrome or Edge.");
    } else {
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = false;
      recognition.lang = currentLang;

      recognition.onstart = () => {
        isListening = true;
        document.getElementById('micBtn').classList.add('listening');
        document.getElementById('statusText').textContent = 'Listening...';
      };

      recognition.onerror = (e) => {
        if (e.error === 'not-allowed') {
          alert("Microphone permission denied.");
          isListening = false;
        }
      };

      recognition.onend = () => {
        if (isListening && !window.speechSynthesis.speaking) {
          try { recognition.start(); } catch(err) {}
        } else if (!isListening) {
          document.getElementById('micBtn').classList.remove('listening');
          document.getElementById('statusText').textContent = 'Microphone: Off';
        }
      };

      recognition.onresult = (event) => {
        const lastIndex = event.results.length - 1;
        const transcript = event.results[lastIndex][0].transcript.trim();
        document.getElementById('transcription').textContent = `Heard: "${transcript}"`;
        processVoiceCommand(transcript);
      };
    }

    document.getElementById('micBtn').addEventListener('click', () => {
      initAudioContext();
      if (isListening) {
        isListening = false;
        recognition.stop();
      } else {
        isListening = true;
        recognition.lang = currentLang;
        recognition.start();
      }
    });

    function setLanguage(lang) {
      currentLang = lang;
      document.getElementById('langEn').classList.toggle('active', lang === 'en-US');
      document.getElementById('langHi').classList.toggle('active', lang === 'hi-IN');
      if (isListening) {
        recognition.stop();
      }
    }

    function processVoiceCommand(rawText) {
      const feedbackEl = document.getElementById('feedback');
      const text = rawText.toLowerCase();

      // 1. GREETINGS & RESPONSES
      if (text.includes('good morning') || text.includes('subah samay') || text.includes('सुप्रभात')) {
        const reply = "Very good morning Krishiv";
        feedbackEl.textContent = reply;
        speakResponse(reply);
        return;
      }
      else if (text.includes('good afternoon') || text.includes('दोपहर')) {
        const reply = "Very good afternoon Krishiv";
        feedbackEl.textContent = reply;
        speakResponse(reply);
        return;
      }
      else if (text.includes('good evening') || text.includes('shyam') || text.includes('शाम')) {
        const reply = "Very good evening Krishiv";
        feedbackEl.textContent = reply;
        speakResponse(reply);
        return;
      }
      else if (text.includes('bye') || text.includes('good bye') || text.includes('bye mony') || text.includes('बाय')) {
        const reply = "Good bye Krishiv";
        feedbackEl.textContent = reply;
        speakResponse(reply);
        return;
      }

      // 2. WAKE WORD CHECK FOR MUSIC COMMANDS
      const wakeWords = ['mony', 'moni', 'money', 'मोंनी', 'मोनी', 'मूनी'];
      const matchedWake = wakeWords.find(w => text.includes(w));

      if (!matchedWake) {
        feedbackEl.textContent = "Ignored: Prefix with 'Mony'";
        return;
      }

      let phrase = text.substring(text.indexOf(matchedWake) + matchedWake.length).trim();

      // Song query extraction
      let songQuery = "";
      const gaoRegex = /(.*?)\s*(gao|gow|go|gaoo|sunao|sunaao|play|gaa|गाओ|सुनाओ|चलाओ|बजाओ)$/i;
      const gaoMatch = phrase.match(gaoRegex);

      if (gaoMatch && gaoMatch[1].trim().length > 0) {
        songQuery = gaoMatch[1].trim();
      } else {
        const playPrefixMatch = phrase.match(/^(play|chalo|bajao|चलाओ|बजाओ)\s+(.+)$/i);
        if (playPrefixMatch) {
          songQuery = playPrefixMatch[2].trim();
        }
      }

      songQuery = songQuery.replace(/^(gana|song|a|the|गाना)\s+/i, "").trim();

      if (songQuery.length > 0) {
        if (searchAndPlaySong(songQuery)) {
          feedbackEl.textContent = `Playing: "${songQuery}"`;
          return;
        } else {
          feedbackEl.textContent = `No track match for: "${songQuery}"`;
          return;
        }
      }

      // Standard Controls Fallback
      if (phrase.includes('pause') || phrase.includes('stop') || phrase.includes('roko') || phrase.includes('band')) {
        audio.pause();
        document.getElementById('playPauseBtn').textContent = '▶️';
        feedbackEl.textContent = "Action: Paused";
      } else if (phrase.includes('play') || phrase.includes('start') || phrase.includes('chalo')) {
        if (audio.paused && audio.src) {
          audio.play();
          document.getElementById('playPauseBtn').textContent = '⏸️';
          feedbackEl.textContent = "Action: Resumed";
        } else if (playlist.length > 0) {
          playTrack(0, true);
        }
      } else if (phrase.includes('next') || phrase.includes('agla')) {
        nextTrack();
        feedbackEl.textContent = "Action: Next track";
      } else if (phrase.includes('previous') || phrase.includes('pichhla')) {
        prevTrack();
        feedbackEl.textContent = "Action: Previous track";
      }
    }

    audio.onended = () => nextTrack();
</script>
</body>
</html>
