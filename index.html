<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mony - Voice Player & Kids AI Assistant</title>
    <style>
        :root {
          --bg-color: #0f172a;
          --card-bg: #1e293b;
          --accent: #6366f1;
          --accent-hover: #4f46e5;
          --kids-accent: #f59e0b;
          --text-main: #f8fafc;
          --text-muted: #94a3b8;
          --active-green: #22c55e;
        }

        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
          font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
          background-color: var(--bg-color);
          color: var(--text-main);
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          align-items: center;
          padding: 12px;
        }

        header {
          text-align: center;
          margin-bottom: 12px;
          width: 100%;
        }

        header h1 {
          font-size: clamp(1.4rem, 5vw, 2.2rem);
          color: var(--accent);
          margin-bottom: 4px;
        }

        header p {
          color: var(--text-muted);
          font-size: clamp(0.75rem, 3vw, 0.9rem);
          padding: 0 10px;
        }

        .container {
          width: 100%;
          max-width: 1000px;
          display: grid;
          grid-template-columns: 1fr;
          gap: 15px;
        }

        @media (min-width: 768px) {
          .container {
            grid-template-columns: 340px 1fr;
            gap: 20px;
          }
        }

        .card {
          background-color: var(--card-bg);
          border-radius: 12px;
          padding: 16px;
          box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
          width: 100%;
        }

        .voice-status-box {
          display: flex;
          flex-direction: column;
          align-items: center;
          text-align: center;
          gap: 10px;
        }

        .mic-btn {
          width: clamp(60px, 16vw, 75px);
          height: clamp(60px, 16vw, 75px);
          border-radius: 50%;
          border: none;
          background-color: #334155;
          color: white;
          font-size: clamp(1.5rem, 5vw, 2rem);
          cursor: pointer;
          transition: all 0.3s ease;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        .mic-btn.listening {
          background-color: var(--active-green);
          box-shadow: 0 0 20px var(--active-green);
        }

        .transcription-box {
          width: 100%;
          background-color: rgba(0,0,0,0.25);
          border-radius: 8px;
          padding: 8px;
          min-height: 45px;
          font-size: 0.85rem;
          color: #cbd5e1;
          word-break: break-word;
        }

        .command-feedback {
          width: 100%;
          padding: 10px;
          background-color: rgba(99, 102, 241, 0.15);
          border: 1px solid var(--accent);
          border-radius: 8px;
          font-weight: 600;
          color: #a5b4fc;
          font-size: 0.9rem;
          word-break: break-word;
          text-align: center;
          min-height: 45px;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        .lang-selector {
          display: flex;
          gap: 8px;
          width: 100%;
          justify-content: center;
        }

        .lang-btn {
          flex: 1;
          max-width: 120px;
          padding: 6px 10px;
          border: 1px solid var(--accent);
          background: transparent;
          color: var(--text-main);
          border-radius: 6px;
          cursor: pointer;
          font-size: 0.8rem;
        }

        .lang-btn.active {
          background: var(--accent);
        }

        .kids-bar {
          display: flex;
          flex-wrap: wrap;
          gap: 6px;
          width: 100%;
          margin-top: 5px;
          justify-content: center;
        }

        .kids-btn {
          background-color: rgba(245, 158, 11, 0.2);
          border: 1px solid var(--kids-accent);
          color: #fef08a;
          padding: 6px 10px;
          border-radius: 6px;
          font-size: 0.75rem;
          cursor: pointer;
          flex: 1 1 30%;
          text-align: center;
        }

        .kids-btn:active {
          background-color: var(--kids-accent);
          color: black;
        }

        .player-section {
          display: flex;
          flex-direction: column;
          gap: 12px;
        }

        canvas {
          width: 100%;
          height: 90px;
          background-color: #090d16;
          border-radius: 8px;
        }

        .track-title {
          font-weight: bold;
          font-size: clamp(0.9rem, 3.5vw, 1.05rem);
          text-align: center;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }

        .controls-row {
          display: flex;
          justify-content: center;
          align-items: center;
          gap: 15px;
        }

        .btn-ctrl {
          background-color: #334155;
          border: none;
          color: white;
          padding: 10px 18px;
          border-radius: 8px;
          cursor: pointer;
          font-size: 1.1rem;
          touch-action: manipulation;
        }

        .file-dropzone {
          border: 2px dashed #475569;
          border-radius: 8px;
          padding: 10px;
          text-align: center;
          cursor: pointer;
          font-size: 0.8rem;
          color: var(--text-muted);
        }

        .playlist {
          max-height: 200px;
          overflow-y: auto;
          list-style: none;
          margin-top: 5px;
          border: 1px solid #334155;
          border-radius: 6px;
        }

        .playlist li {
          padding: 8px 10px;
          border-bottom: 1px solid #334155;
          cursor: pointer;
          font-size: 0.85rem;
          word-break: break-word;
        }

        .playlist li.active {
          background-color: #334155;
          color: #818cf8;
          font-weight: bold;
        }

        .api-key-box {
          margin-top: 8px;
          display: flex;
          gap: 6px;
          width: 100%;
        }

        .api-key-box input {
          flex: 1;
          background: #0f172a;
          border: 1px solid #475569;
          color: white;
          padding: 6px;
          border-radius: 4px;
          font-size: 0.75rem;
        }

        .api-key-box button {
          background: var(--accent);
          border: none;
          color: white;
          padding: 6px 10px;
          border-radius: 4px;
          font-size: 0.75rem;
          cursor: pointer;
        }
    </style>
</head>
<body>

<header>
    <h1>Mony Voice Player & AI</h1>
    <p>Prefix commands with <strong>"Mony"</strong> (e.g. <em>"Mony teach ABCD"</em> or <em>"Mony what is my location"</em>)</p>
</header>

<div class="container">
    <div class="card voice-status-box">
        <h3>Voice Assistant</h3>
        <button id="micBtn" class="mic-btn">🎤</button>
        <div id="statusText" style="font-size: 0.8rem; color: var(--text-muted);">Microphone: Off</div>

        <div class="lang-selector">
            <button id="langEn" class="lang-btn active" onclick="setLanguage('en-US')">English</button>
            <button id="langHi" class="lang-btn" onclick="setLanguage('hi-IN')">Hindi (हिंदी)</button>
        </div>

        <div class="transcription-box" id="transcription">Click Mic to start listening...</div>
        <div class="command-feedback" id="feedback">Waiting for voice command...</div>

        <div style="width: 100%; margin-top: 5px;">
            <span style="font-size: 0.75rem; color: var(--kids-accent); font-weight: bold;">👶 Quick Actions</span>
            <div class="kids-bar">
                <button class="kids-btn" onclick="greetByTime()">👋 Greet Me</button>
                <button class="kids-btn" onclick="tellLocation()">📍 Location</button>
                <button class="kids-btn" onclick="tellTime()">⏰ Time</button>
                <button class="kids-btn" onclick="teachABCD()">🔤 ABCD A-Z</button>
                <button class="kids-btn" onclick="teachNumbers()">🔢 Numbers 1-10</button>
                <button class="kids-btn" onclick="tellStory('en')">📖 Story</button>
            </div>
        </div>

        <div class="api-key-box">
            <input type="password" id="geminiApiKey" placeholder="Free Gemini API Key (Optional)">
            <button onclick="saveApiKey()">Save</button>
        </div>
    </div>

    <div class="card player-section">
        <canvas id="visualizer"></canvas>
        <div class="track-info">
            <div class="track-title" id="trackTitle">Loading playlist...</div>
        </div>

        <div class="controls-row">
            <button class="btn-ctrl" onclick="prevTrack()">⏮️</button>
            <button class="btn-ctrl" id="playPauseBtn" onclick="togglePlay()">▶️</button>
            <button class="btn-ctrl" onclick="nextTrack()">⏭️</button>
        </div>

        <div class="file-dropzone" onclick="document.getElementById('fileInput').click()">
            📁 Add local audio files
            <input type="file" id="fileInput" multiple accept="audio/*" style="display: none;" onchange="loadFiles(this.files)">
        </div>

        <h4>Playlist</h4>
        <ul class="playlist" id="playlist"></ul>
    </div>
</div>

<script>
    const SOUND_ALIKE_WAKE_WORDS = [
      'mony', 'moni', 'money', 'mani', 'manny', 'monie', 'mooney',
      'moonie', 'muni', 'munni', 'monne', 'mona', 'moani', 'mowney',
      'mouny', 'mauney', 'mauni', 'moneyy', 'moniy', 'monii', 'monyy',
      'moli', 'moliya',
      'मोंनी', 'मोनी', 'मनी', 'मुन्नी', 'मुनी', 'मोनि', 'मॉनी', 'मोणी', 'मौन'
    ];

    let audio = new Audio();
    audio.crossOrigin = "anonymous";
    let playlist = [];
    let currentIndex = -1;
    let recognition;
    let isListening = false;
    let currentLang = 'en-US';
    let systemVoices = [];
    let userApiKey = localStorage.getItem('MONY_GEMINI_KEY') || "";

    if (userApiKey) {
      document.getElementById('geminiApiKey').value = userApiKey;
    }

    function saveApiKey() {
      userApiKey = document.getElementById('geminiApiKey').value.trim();
      localStorage.setItem('MONY_GEMINI_KEY', userApiKey);
      document.getElementById('feedback').textContent = "Gemini API Key Saved!";
    }

    function populateVoices() {
      if ('speechSynthesis' in window) {
        systemVoices = window.speechSynthesis.getVoices();
      }
    }

    populateVoices();
    if ('speechSynthesis' in window && window.speechSynthesis.onvoiceschanged !== undefined) {
      window.speechSynthesis.onvoiceschanged = populateVoices;
    }

    function getFemaleVoice(lang) {
      if (!systemVoices || systemVoices.length === 0) {
        systemVoices = window.speechSynthesis.getVoices();
      }

      const isHindi = lang.startsWith('hi');
      const langPrefix = isHindi ? 'hi' : 'en';
      const femaleKeywords = ['female', 'zira', 'samantha', 'victoria', 'karen', 'fiona', 'veena', 'google us english', 'google हिन्दी', 'siri'];

      let matchedVoice = systemVoices.find(voice => {
        const name = voice.name.toLowerCase();
        const voiceLang = voice.lang.toLowerCase();
        return voiceLang.startsWith(langPrefix) && femaleKeywords.some(kw => name.includes(kw));
      });

      if (!matchedVoice) {
        matchedVoice = systemVoices.find(voice => voice.lang.toLowerCase().startsWith(langPrefix));
      }

      return matchedVoice || null;
    }

    function speakResponse(text) {
      if ('speechSynthesis' in window) {
        if (recognition && isListening) {
          try { recognition.stop(); } catch(e) {}
        }

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = currentLang;
        utterance.rate = 0.92;
        utterance.pitch = 1.1;

        const femaleVoice = getFemaleVoice(currentLang);
        if (femaleVoice) {
          utterance.voice = femaleVoice;
        }

        utterance.onend = () => {
          if (isListening) {
            try { recognition.start(); } catch(e) {}
          }
        };

        window.speechSynthesis.speak(utterance);
      }
    }

    // 1. FULL A TO Z PHONICS ALPHABET
    function teachABCD() {
      const fullAbcdText = "A for Apple, B for Ball, C for Cat, D for Dog, E for Elephant, F for Fish, G for Grapes, H for Hen, I for Ice cream, J for Joker, K for Kite, L for Lion, M for Monkey, N for Nest, O for Orange, P for Parrot, Q for Queen, R for Rabbit, S for Sun, T for Tiger, U for Umbrella, V for Van, W for Watch, X for Xylophone, Y for Yak, Z for Zebra.";
      document.getElementById('feedback').textContent = fullAbcdText;
      speakResponse(fullAbcdText);
    }

    function teachNumbers() {
      const numbersText = "One, Two, Three, Four, Five, Six, Seven, Eight, Nine, Ten";
      document.getElementById('feedback').textContent = numbersText;
      speakResponse(numbersText);
    }

    // 2. LIVE LOCATION DETECTION ENGINE
    function tellLocation() {
      const feedbackEl = document.getElementById('feedback');
      const isHindi = currentLang.startsWith('hi');

      if (!navigator.geolocation) {
        const errMsg = isHindi ? "आपके ब्राउज़र में लोकेशन की सुविधा उपलब्ध नहीं है" : "Geolocation is not supported by your browser.";
        feedbackEl.textContent = errMsg;
        speakResponse(errMsg);
        return;
      }

      feedbackEl.textContent = isHindi ? "आपकी लोकेशन खोजी जा रही है..." : "Checking location...";

      navigator.geolocation.getCurrentPosition(async (position) => {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;

        try {
          // Free Nominatim OpenStreetMap Reverse Geocoding
          const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
          if (response.ok) {
            const data = await response.json();
            const addr = data.address;
            const place = addr.village || addr.suburb || addr.town || addr.city || addr.county || addr.state_district || "your current area";
            const state = addr.state || "";

            let locationReply = isHindi
              ? `आप अभी ${place} ${state} के पास हैं`
              : `You are currently near ${place}, ${state}`;

            feedbackEl.textContent = locationReply;
            speakResponse(locationReply);
          } else {
            throw new Error("Geocoding failed");
          }
        } catch (err) {
          let coordsReply = isHindi
            ? `आपकी लोकेशन अक्षांश ${lat.toFixed(2)} और देशांतर ${lon.toFixed(2)} है`
            : `Your coordinates are latitude ${lat.toFixed(2)} and longitude ${lon.toFixed(2)}`;
          feedbackEl.textContent = coordsReply;
          speakResponse(coordsReply);
        }
      }, (error) => {
        const errReply = isHindi ? "लोकेशन एक्सेस की अनुमति नहीं मिली" : "Unable to access your location. Please enable location permission.";
        feedbackEl.textContent = errReply;
        speakResponse(errReply);
      }, { timeout: 10000 });
    }

    function greetByTime() {
      const now = new Date();
      const hours = now.getHours();
      const isHindi = currentLang.startsWith('hi');
      let reply = "";

      if (hours >= 4 && hours < 8) {
        reply = isHindi ? "वेरी गुड अर्ली मॉर्निंग कृषिव" : "Very good early morning Krishiv";
      } else if (hours >= 8 && hours < 12) {
        reply = isHindi ? "वेरी गुड मॉर्निंग कृषिव" : "Very good morning Krishiv";
      } else if (hours === 12) {
        reply = isHindi ? "गुड नून कृषिव" : "Good noon Krishiv";
      } else if (hours >= 13 && hours < 17) {
        reply = isHindi ? "वेरी गुड आफ्टरनून कृषिव" : "Very good afternoon Krishiv";
      } else if (hours >= 17 && hours < 21) {
        reply = isHindi ? "वेरी गुड इवनिंग कृषिव" : "Very good evening Krishiv";
      } else {
        reply = isHindi ? "गुड नाईट कृषिव" : "Good night Krishiv";
      }

      document.getElementById('feedback').textContent = reply;
      speakResponse(reply);
    }

    function tellTime() {
      const now = new Date();
      let timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      let reply = "";
      if (currentLang.startsWith('hi')) {
        reply = `अभी समय ${timeString} हो रहा है`;
      } else {
        reply = `The current time is ${timeString}`;
      }

      document.getElementById('feedback').textContent = reply;
      speakResponse(reply);
    }

    function tellDate() {
      const now = new Date();
      let dateString = now.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });

      let reply = "";
      if (currentLang.startsWith('hi')) {
        reply = `आज की तारीख है ${dateString}`;
      } else {
        reply = `Today is ${dateString}`;
      }

      document.getElementById('feedback').textContent = reply;
      speakResponse(reply);
    }

    let audioCtx, analyser, srcNode;
    const canvas = document.getElementById('visualizer');
    const canvasCtx = canvas.getContext('2d');

    async function tellStory(lang = 'en') {
      const feedbackEl = document.getElementById('feedback');
      feedbackEl.textContent = "Generating a story...";

      if (userApiKey) {
        const prompt = lang === 'hi'
          ? "बच्चों के लिए 3 लाइनों की एक छोटी और मजेदार नैतिक कहानी सुनाओ।"
          : "Tell a short, 3-line fun moral story for young children.";

        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${userApiKey}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
          });
          const data = await res.json();
          const story = data.candidates[0].content.parts[0].text;
          feedbackEl.textContent = story;
          speakResponse(story);
          return;
        } catch (err) {
          console.warn("Gemini API error, falling back to built-in story.", err);
        }
      }

      if (lang === 'hi') {
        const hiStory = "एक जंगल में एक भूखा कौआ था। उसे एक पानी का घड़ा मिला जिसमें पानी बहुत कम था। उसने घड़े में छोटे-छोटे कंकड़ डाले और पानी ऊपर आ गया। कौए ने पानी पिया और खुश होकर उड़ गया।";
        feedbackEl.textContent = hiStory;
        speakResponse(hiStory);
      } else {
        const enStory = "Once upon a time, a clever little turtle raced a confident hare. The turtle walked slowly and steadily without stopping, while the hare took a nap. The steady turtle won the race!";
        feedbackEl.textContent = enStory;
        speakResponse(enStory);
      }
    }

    async function loadGitHubSongsFolder() {
      try {
        const response = await fetch('./songs/playlist.json');
        if (response.ok) {
          const songFiles = await response.json();
          songFiles.forEach(filename => {
            const nameStr = typeof filename === 'string' ? filename : filename.name;
            const fullFileName = nameStr.endsWith('.mp3') ? nameStr : `${nameStr}.mp3`;
            addTrackToPlaylist(nameStr, `./songs/${encodeURIComponent(fullFileName)}`);
          });
          document.getElementById('trackTitle').textContent = playlist.length > 0 ? playlist[0].name : "No tracks loaded";
        } else {
          document.getElementById('trackTitle').textContent = "Select local audio files to play.";
        }
      } catch (err) {
        document.getElementById('trackTitle').textContent = "Select local audio files to play.";
      }
    }

    function addTrackToPlaylist(name, url) {
      const cleanTitle = name.replace(/\.[^/.]+$/, "").replace(/_/g, " ");
      playlist.push({
        name: cleanTitle,
        tokens: cleanTitle.toLowerCase().split(/[^a-zA-Z0-9\u0900-\u097F]+/).filter(Boolean),
        url: url
      });
      updatePlaylistUI();
      if (currentIndex === -1 && playlist.length > 0) {
        playTrack(0, false);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadGitHubSongsFolder();
    });

    function initAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        srcNode = audioCtx.createMediaElementSource(audio);
        srcNode.connect(analyser);
        analyser.connect(audioCtx.destination);
        analyser.fftSize = 64;
        drawVisualizer();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function drawVisualizer() {
      requestAnimationFrame(drawVisualizer);
      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);
      analyser.getByteFrequencyData(dataArray);

      canvasCtx.fillStyle = '#090d16';
      canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

      const barWidth = (canvas.width / bufferLength) * 2.5;
      let x = 0;
      for (let i = 0; i < bufferLength; i++) {
        const barHeight = (dataArray[i] / 255) * canvas.height;
        canvasCtx.fillStyle = '#6366f1';
        canvasCtx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
        x += barWidth + 2;
      }
    }

    function loadFiles(files) {
      for (let file of files) {
        addTrackToPlaylist(file.name, URL.createObjectURL(file));
      }
    }

    function updatePlaylistUI() {
      const listEl = document.getElementById('playlist');
      listEl.innerHTML = '';
      playlist.forEach((track, idx) => {
        const li = document.createElement('li');
        li.textContent = `${idx + 1}. ${track.name}`;
        if (idx === currentIndex) li.classList.add('active');
        li.onclick = () => playTrack(idx, true);
        listEl.appendChild(li);
      });
    }

    function playTrack(index, shouldPlay = true) {
      if (index < 0 || index >= playlist.length) return;
      initAudioContext();
      currentIndex = index;
      audio.src = playlist[currentIndex].url;
      document.getElementById('trackTitle').textContent = playlist[currentIndex].name;

      if (shouldPlay) {
        audio.play().then(() => {
          document.getElementById('playPauseBtn').textContent = '⏸️';
        }).catch(err => console.log("Playback error:", err));
      }
      updatePlaylistUI();
    }

    function togglePlay() {
      if (!audio.src) return;
      initAudioContext();
      if (audio.paused) {
        audio.play();
        document.getElementById('playPauseBtn').textContent = '⏸️';
      } else {
        audio.pause();
        document.getElementById('playPauseBtn').textContent = '▶️';
      }
    }

    function nextTrack() {
      if (playlist.length === 0) return;
      playTrack((currentIndex + 1) % playlist.length, true);
    }

    function prevTrack() {
      if (playlist.length === 0) return;
      playTrack((currentIndex - 1 + playlist.length) % playlist.length, true);
    }

    function searchAndPlaySong(query) {
      if (playlist.length === 0) return false;
      const searchTokens = query.toLowerCase().split(/[^a-zA-Z0-9\u0900-\u097F]+/).filter(w => w.length > 1);
      if (searchTokens.length === 0) return false;

      let bestScore = -1;
      let bestIndex = -1;

      playlist.forEach((track, idx) => {
        let score = 0;
        searchTokens.forEach(st => {
          track.tokens.forEach(tt => {
            if (tt === st) score += 3;
            else if (tt.includes(st) || st.includes(tt)) score += 1;
          });
        });

        if (score > bestScore && score > 0) {
          bestScore = score;
          bestIndex = idx;
        }
      });

      if (bestIndex !== -1) {
        playTrack(bestIndex, true);
        return true;
      }
      return false;
    }

    // Speech Recognition Loop
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      alert("Browser does not support Speech Recognition. Use Chrome or Edge.");
    } else {
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = false;
      recognition.lang = currentLang;

      recognition.onstart = () => {
        isListening = true;
        document.getElementById('micBtn').classList.add('listening');
        document.getElementById('statusText').textContent = 'Listening...';
      };

      recognition.onerror = (e) => {
        if (e.error === 'not-allowed') {
          alert("Microphone permission denied.");
          isListening = false;
        }
      };

      recognition.onend = () => {
        if (isListening && !window.speechSynthesis.speaking) {
          try { recognition.start(); } catch(err) {}
        } else if (!isListening) {
          document.getElementById('micBtn').classList.remove('listening');
          document.getElementById('statusText').textContent = 'Microphone: Off';
        }
      };

      recognition.onresult = (event) => {
        const lastIndex = event.results.length - 1;
        const transcript = event.results[lastIndex][0].transcript.trim();
        document.getElementById('transcription').textContent = `Heard: "${transcript}"`;
        processVoiceCommand(transcript);
      };
    }

    document.getElementById('micBtn').addEventListener('click', () => {
      initAudioContext();
      if (isListening) {
        isListening = false;
        recognition.stop();
      } else {
        isListening = true;
        recognition.lang = currentLang;
        recognition.start();
      }
    });

    function setLanguage(lang) {
      currentLang = lang;
      document.getElementById('langEn').classList.toggle('active', lang === 'en-US');
      document.getElementById('langHi').classList.toggle('active', lang === 'hi-IN');
      if (isListening) {
        recognition.stop();
      }
    }

    function processVoiceCommand(rawText) {
      const feedbackEl = document.getElementById('feedback');
      const text = rawText.toLowerCase().trim();

      const matchedWake = SOUND_ALIKE_WAKE_WORDS.find(w => text.includes(w));

      if (!matchedWake) {
        feedbackEl.textContent = "Ignored: Prefix command with 'Mony'";
        return;
      }

      let command = text.substring(text.indexOf(matchedWake) + matchedWake.length).trim();

      if (command.length === 0) {
        feedbackEl.textContent = "Mony is listening! Please state a command.";
        speakResponse("Yes Krishiv, I am listening.");
        return;
      }

      // Greetings Engine
      if (command.includes('good morning') || command.includes('morning') ||
          command.includes('afternoon') || command.includes('noon') ||
          command.includes('evening') || command.includes('night') ||
          command.includes('hello') || command.includes('hi') || command.includes('नमस्ते')) {
        greetByTime();
        return;
      }
      else if (command.includes('bye') || command.includes('good bye') || command.includes('बाय')) {
        const reply = "Good bye Krishiv";
        feedbackEl.textContent = reply;
        speakResponse(reply);
        return;
      }

      // Location Commands
      if (command.includes('location') || command.includes('where am i') || command.includes('कहाँ हूँ') || command.includes('स्थान')) {
        tellLocation();
        return;
      }

      // Time and Date Matchers
      if (command.includes('time') || command.includes('samay') || command.includes('समय') || command.includes('kitne baje')) {
        tellTime();
        return;
      }
      if (command.includes('date') || command.includes('tarikh') || command.includes('तारीख')) {
        tellDate();
        return;
      }

      // Kids Commands
      if (command.includes('abcd') || command.includes('alphabet') || command.includes('वर्णमाला')) {
        teachABCD();
        return;
      }
      if (command.includes('number') || command.includes('counting') || command.includes('गिनती')) {
        teachNumbers();
        return;
      }
      if (command.includes('story') || command.includes('kahani') || command.includes('कहानी')) {
        tellStory((command.includes('hindi') || command.includes('हिंदी')) ? 'hi' : 'en');
        return;
      }

      // Song Search Matcher
      let songQuery = command.replace(/(gao|gow|go|gaoo|sunao|sunaao|play|gaa|गाओ|सुनाओ|चलाओ|बजाओ|gana|song|गाना)$/gi, "").trim();

      if (songQuery.length > 0) {
        if (searchAndPlaySong(songQuery)) {
          feedbackEl.textContent = `Playing: "${songQuery}"`;
          return;
        } else {
          feedbackEl.textContent = `No track match for: "${songQuery}"`;
          return;
        }
      }

      // Playback Controls Fallback
      if (command.includes('pause') || command.includes('stop') || command.includes('roko') || command.includes('band')) {
        audio.pause();
        document.getElementById('playPauseBtn').textContent = '▶️';
        feedbackEl.textContent = "Action: Paused";
      } else if (command.includes('play') || command.includes('start') || command.includes('chalo')) {
        if (audio.paused && audio.src) {
          audio.play();
          document.getElementById('playPauseBtn').textContent = '⏸️';
          feedbackEl.textContent = "Action: Resumed";
        } else if (playlist.length > 0) {
          playTrack(0, true);
        }
      } else if (command.includes('next') || command.includes('agla')) {
        nextTrack();
        feedbackEl.textContent = "Action: Next track";
      } else if (command.includes('previous') || command.includes('pichhla')) {
        prevTrack();
        feedbackEl.textContent = "Action: Previous track";
      }
    }

    audio.onended = () => nextTrack();
</script>
</body>
</html>
